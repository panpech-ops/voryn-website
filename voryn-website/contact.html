<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="contact.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="assets/logo-black.png" alt="VORYN">
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="account.html">Account</a>
    <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
  </nav>

  <div class="menu-btn">☰</div>
</header>

<section class="contact-page">

  <div class="contact-left">
    <p class="mini">GET IN TOUCH</p>
    <h1>Contact VORYN</h1>

    <p class="text">
      Questions about orders, sizing, future drops, or collaborations?
      Reach out and our team will respond shortly.
    </p>

    <div class="info">
      <p>Email: support@voryn.com</p>
      <p>Instagram: @voryn</p>
      <p>Hours: Mon - Sat / 10:00 - 18:00</p>
    </div>
  </div>

  <div class="contact-right">
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="text" placeholder="Subject" required>
      <textarea placeholder="Your Message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>

</section>

<script src="contact.js"></script>
</body>
</html>
