<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORYN | Account</title>
  <link rel="stylesheet" href="account.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="assets/logo-black.png" alt="VORYN">
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="account.html">Account</a>
    <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
  </nav>

  <div class="menu-btn">☰</div>
</header>

<section class="account-page">

  <div class="account-box">

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <!-- Login -->
    <form class="form active" id="loginForm">
      <p class="mini">WELCOME BACK</p>
      <h1>Access Your Account</h1>

      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>

      <button type="submit" class="main-btn">Login</button>
    </form>

    <!-- Register -->
    <form class="form" id="registerForm">
      <p class="mini">JOIN VORYN</p>
      <h1>Create Account</h1>

      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>

      <button type="submit" class="main-btn">Register</button>
    </form>

  </div>

</section>

<script type="module" src="account.js"></script>
</body>
</html>
